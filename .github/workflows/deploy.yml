# Continuous deployment: every push to main that changes the code or infrastructure
# redeploys the live demo. Enabled only when the repository variable AUTO_DEPLOY is "true".
name: Deploy
on:
  push:
    branches: [main]
    paths: ["src/**", "infra/**", "scripts/**"]

permissions: {}

concurrency:
  group: aws-incidentscribe
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AWS_ROLE_ARN != '' && vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: aws
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" && pytest -q -p no:warnings
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "<1.18.0"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          role-session-name: incidentscribe-deploy
      - name: Deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
          ALLOWED_ORIGINS: ${{ vars.INCIDENTSCRIBE_ALLOWED_ORIGINS }}
        run: bash scripts/up.sh
