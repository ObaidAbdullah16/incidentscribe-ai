[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentscribe"
dynamic = ["version"]
description = "AIOps incident assistant: alerts to Bedrock summaries with runbook RAG, guardrails, PII redaction and cost caps"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Obaid Abdullah" }]
dependencies = []   # Lambda runtime provides boto3; everything else is the standard library

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.4", "boto3>=1.34", "moto[dynamodb,ssm]>=5.0"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["incidentscribe"]

[tool.setuptools.package-data]
incidentscribe = ["runbooks/*.md", "samples.json"]

[tool.setuptools.dynamic]
version = { attr = "incidentscribe.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
